title: "โครงสร้างการสนทนาที่เร็วที่สุดสำหรับการสร้างงานหนึ่งชิ้น"
subtitle: "กรอบข้อมูลเชิงโครงสร้างเพื่อลดการสุ่มในกระบวนการมนุษย์–AI"
author: "ยศหรี ลาที (Yaoharee Lahtee)"
authorshort: "ลาที"
orcid: ""
affiliation: "Center for AI Civic Knowledge"
shorttitle: "โครงสร้างการสนทนาที่เร็วที่สุด"
version: "v1.0"
date: "20 กันยายน 2026"

abstract: >
  บทความนี้ตอบคำถามว่า เมื่อมนุษย์ต้องการให้ระบบปัญญาประดิษฐ์ช่วยสร้างงานชิ้นหนึ่งให้เสร็จเร็วที่สุด
  โดยไม่ต้องพึ่งการลองผิดลองถูกแบบสุ่ม ควรจัดโครงสร้างของบทสนทนาอย่างไร ข้อเสนอหลักคือการแยกงาน
  ออกเป็นสี่ชั้นที่ต้องส่งต่อกันตามลำดับเสมอ ได้แก่ ข้อมูลเข้าเชิงโครงสร้าง (schema) ตัวแปลงเป็นผลลัพธ์
  (generator) ตัวอย่างข้อมูลจริงหนึ่งชุด (example) และขั้นตอนตรวจสอบผลลัพธ์จริง (verification) กลไก
  ที่ทำให้ข้อเสนอนี้ทำงานคือการบังคับให้ทุกคำถามที่เคยเป็นบทสนทนาอิสระ กลายเป็นฟิลด์ที่มีชื่อและชนิดตายตัว
  ก่อนเริ่มงานจริง ทำให้ทั้งมนุษย์และ AI ไม่ต้องเดาโครงสร้างซ้ำทุกครั้ง บทความนี้ทำให้เห็นได้ชัดว่าความเร็ว
  ในการสร้างงานไม่ได้มาจากการพิมพ์เร็วขึ้น แต่มาจากการลดจำนวนรอบของการถามซ้ำและการแก้โครงสร้างที่ผิดพลาด
  ตั้งแต่ต้น
keywords: "โครงสร้างข้อมูล; การสร้างงานอัตโนมัติ; JSON Schema; เทมเพลตเอกสาร; มนุษย์-AI"

methodology_note: >
  บทความนี้เป็นบทความเชิงทฤษฎีและกรอบแนวคิดที่พัฒนาจากปัญหาการทำงานจริงในเวิร์กสเปซของศูนย์ฯ คือ
  บทสนทนากับ AI ที่ใช้เวลานานเกินจำเป็นเพราะโครงสร้างของงานไม่ได้ถูกกำหนดไว้ล่วงหน้า ฉบับปัจจุบันมีสถานะ
  เป็น \textbf{PREPRINT} และยังไม่ผ่านการประเมินโดยผู้ทรงคุณวุฒิ

  ในกระบวนการพัฒนางานนี้ ปัญญาประดิษฐ์มีบทบาทในการช่วยขยายพื้นที่ของการสืบค้นรูปแบบ schema ที่ใช้ได้จริง
  เสนอโครงสร้างไฟล์ที่สอดคล้องกับแบบแผนเดิมของคลังเอกสารนี้ และช่วยตรวจความสอดคล้องระหว่างไฟล์ schema
  เทมเพลต และตัวอย่างข้อมูล โดยมนุษย์ยังเป็นผู้ถือปัญหา ตัดสินใจเชิงแนวคิดว่าโครงสร้างสี่ชั้นใดควรบังคับ
  และรับผิดชอบต่อข้อเสนอทั้งหมดของบทความ

  ผลจากการสนทนากับ AI ไม่ควรถูกถือเป็นความรู้ที่ได้รับการรับรองโดยอัตโนมัติ แต่เป็นสิ่งที่ควรพิจารณาและ
  ต้องผ่านการตรวจด้วยการใช้งานจริงซ้ำหลายครั้งในหลายประเภทงาน ก่อนถือว่าโครงสร้างนี้ใช้ได้ทั่วไป

sections:
  - heading: "บทนำ"
    body: >
      ปัญหาที่พบซ้ำในการทำงานร่วมกับ AI คือแต่ละครั้งที่จะสร้างงานชิ้นหนึ่ง ทั้งมนุษย์และ AI ต้องเสียเวลา
      ถามตอบเพื่อสร้างโครงสร้างของงานใหม่ทุกครั้ง ทั้งที่งานประเภทเดียวกันมีรูปแบบซ้ำเดิมอยู่แล้ว คำถามหลัก
      ของบทความนี้คือ ทำอย่างไรให้การสร้างงานหนึ่งชิ้นใช้เวลาน้อยที่สุดโดยไม่สุ่มโครงสร้างใหม่ทุกครั้ง
      หน่วยวิเคราะห์ของบทความนี้คือ "งานหนึ่งชิ้น" ที่มีข้อมูลเข้าและผลลัพธ์ที่ทำนายรูปแบบได้ ข้อเสนอหลัก
      ของบทความคือ โครงสร้างสี่ชั้นที่บังคับให้ข้อมูลเข้าเป็นฟิลด์ตายตัวก่อนเริ่มงานเสมอ

  - heading: "กรอบแนวคิดหรือข้อเสนอหลัก"
    body: >
      กรอบที่เสนอในบทความนี้ประกอบด้วยสี่ชั้นที่เรียงลำดับตายตัว ชั้นแรกคือ schema ซึ่งกำหนดชื่อฟิลด์
      ชนิดข้อมูล และคำอธิบายว่าฟิลด์นั้นแปลไปเป็นส่วนใดของผลลัพธ์สุดท้าย ชั้นที่สองคือ generator ซึ่งรับ
      ข้อมูลที่ผ่านการตรวจตาม schema แล้วแปลงเป็นผลลัพธ์ตามรูปแบบเทมเพลตที่ล็อกไว้ ชั้นที่สามคือ example
      ซึ่งเป็นข้อมูลจริงชุดหนึ่งที่ใช้พิสูจน์ว่า schema และ generator ทำงานร่วมกันได้จริง และชั้นที่สี่คือ
      verification ซึ่งเป็นขั้นตอนตรวจผลลัพธ์จริงหลังสร้างเสร็จ ไม่ใช่การอนุมานว่าน่าจะถูกต้อง

  - heading: "ตำแหน่งเมื่อเทียบกับแนวปฏิบัติเดิม"
    body: >
      แนวปฏิบัติเดิมของการสนทนากับ AI มักเริ่มจากการอธิบายงานเป็นภาษาธรรมชาติอย่างอิสระ ซึ่งทำให้ทั้งสองฝ่าย
      ต้องเดาโครงสร้างที่ขาดหายไปซ้ำทุกรอบ ข้อเสนอในบทความนี้ต่างตรงที่บังคับให้โครงสร้างข้อมูลถูกกำหนด
      เป็นลายลักษณ์อักษรก่อนเริ่มงานเสมอ ทำให้ตรวจสอบความครบถ้วนของข้อมูลเข้าได้ก่อนที่จะเริ่มสร้างผลลัพธ์จริง

  - heading: "ขอบเขต เงื่อนไข และข้อจำกัด"
    body: >
      กรอบนี้ใช้ได้ดีกับงานที่มีรูปแบบผลลัพธ์ซ้ำเดิมและสามารถนิยามฟิลด์ข้อมูลเข้าได้ล่วงหน้า แต่ไม่เหมาะกับ
      งานสร้างสรรค์ที่โครงสร้างผลลัพธ์เปลี่ยนแปลงทุกครั้งตามธรรมชาติของงานเอง หลักฐานที่จะทำให้ต้องแก้ไข
      ข้อเสนอนี้คือกรณีที่การบังคับ schema ล่วงหน้าทำให้งานช้าลงกว่าการสนทนาอย่างอิสระในทางปฏิบัติจริง

  - heading: "บทสรุป"
    body: >
      บทความนี้เสนอว่าความเร็วในการสร้างงานร่วมกับ AI มาจากการลดรอบของการถามซ้ำด้วยโครงสร้างข้อมูลที่กำหนด
      ไว้ล่วงหน้า มากกว่าจากความเร็วของการสนทนาเอง คำถามที่ยังเปิดอยู่คือขอบเขตที่แน่นอนของงานประเภทใดบ้าง
      ที่ควรบังคับ schema ก่อนเริ่ม และประเภทใดที่ควรปล่อยให้เป็นบทสนทนาอิสระ

