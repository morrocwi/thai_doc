# Example data for templates/formal_letter.txt.j2
title: "หนังสือขอความอนุเคราะห์ประชาสัมพันธ์กิจกรรม"
recipient: "ผู้อำนวยการโรงเรียนตัวอย่างวิทยา"
body_paragraph_1: >
  ด้วยหน่วยงานของเรามีกำหนดจัดกิจกรรมส่งเสริมความรู้ด้านเทคโนโลยีสารสนเทศ
  สำหรับนักเรียนและบุคคลทั่วไป โดยมีวัตถุประสงค์เพื่อเผยแพร่ความรู้และทักษะที่จำเป็น
  ต่อการพัฒนาศักยภาพของเยาวชนในยุคดิจิทัล
body_paragraph_2: >
  จึงเรียนมาเพื่อขอความอนุเคราะห์ประชาสัมพันธ์กิจกรรมดังกล่าวให้นักเรียนและผู้ปกครองทราบ
  โดยทั่วกัน และหวังเป็นอย่างยิ่งว่าจะได้รับความร่วมมือจากท่านเป็นอย่างดี
sender_name: "นายตัวอย่าง ใจดี"
sender_position: "ผู้ประสานงานโครงการ"
